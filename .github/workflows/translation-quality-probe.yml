name: Translation quality probe
on:
  push:
    branches: [main]
    paths: [".github/workflows/translation-quality-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare short scientific English-to-Chinese translations
        run: |
          python3 - <<'PY'
          import urllib.parse,urllib.request,json
          samples=[
          "Channel knowledge maps establish a mapping from geographical locations to channel characteristics.",
          "The control is learned by adjoint matching from terminal energy gradients.",
          "We propose a cycle-adaptive masking strategy that prevents shortcut learning."
          ]
          for s in samples:
              q=urllib.parse.urlencode(dict(client='gtx',sl='en',tl='zh-CN',dt='t',q=s))
              url='https://translate.googleapis.com/translate_a/single?'+q
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      payload=json.load(r)
                  print('RESULT:', ''.join(item[0] or '' for item in payload[0]),flush=True)
              except Exception as e:
                  print('TRANSLATION_SERVICE_UNAVAILABLE:',repr(e),flush=True)
                  raise
          PY
