name: Import Voyager Golden Record Avatar

on:
  push:
    paths:
      - .github/workflows/import-voyager-avatar.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-avatar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download 250px NASA/JPL public-domain thumbnail from Wikimedia Commons
        run: |
          mkdir -p assets/img
          curl --fail --location --retry 3 --max-time 45 -A "Mozilla/5.0" \
            "https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/The_Sounds_of_Earth_Record_Cover_-_GPN-2000-001978.jpg/250px-The_Sounds_of_Earth_Record_Cover_-_GPN-2000-001978.jpg" \
            -o assets/img/voyager-golden-record.jpg
          test "$(file -b --mime-type assets/img/voyager-golden-record.jpg)" = "image/jpeg"
          du -h assets/img/voyager-golden-record.jpg
      - name: Commit avatar image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/voyager-golden-record.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add Voyager Golden Record avatar image"
            git push
          fi
