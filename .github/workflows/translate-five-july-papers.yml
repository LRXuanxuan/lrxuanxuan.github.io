name: "Translate five archived July papers"
on:
  push:
    branches: [main]
    paths:
      - "tools/translate_five_arxiv_papers.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "paper-translations-2026-07-22"
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF text extractor
        run: |
          python -m pip install --disable-pip-version-check 'pymupdf>=1.24,<2'
      - name: Translate five PDF texts through second-pass service and validate pages
        run: |
          python -u tools/translate_five_arxiv_papers.py | tee /tmp/translate-log.txt
          grep -q 'TRANSLATIONS_COMPLETE=5' /tmp/translate-log.txt
      - name: Publish full-page translations and update existing article links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/translations/2026-10-12-*.md assets/papers/translations/2026-10-12-*.md \
            papers/items/2e094f4029e01a73.md papers/items/ad7c6f680aefcbc8.md \
            papers/items/2b09701c969754d7.md papers/items/65907205876c1561.md \
            papers/items/5cc0d0d751befc62.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: publish five machine-translated full paper texts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Request Pages rebuild after bot commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main
