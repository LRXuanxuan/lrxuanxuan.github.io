      url: "https://arxiv.org/abs/1706.03762"
    - label: "Ma et al. (ACL 2025)：Pragmatics in the Era of Large Language Models"
      url: "https://aclanthology.org/2025.acl-long.425/"
    - label: "Lee et al. (2025)：Pragmatic Metacognitive Prompting for Sarcasm Detection"
      url: "https://aclanthology.org/2025.chum-1.7/"

- slug: "channel-generative-ai-vs-llm"
  added_at: "2026-10-12T13:58:10+08:00"
  title: "生成式信道估计与 LLM：同一个祖宗，两条技术路线"
  english: "Generative MIMO Channel Estimation vs. Large Language Models"
  teaser: "同样学习高维数据分布，为什么一个沿连续流生成复数信道矩阵，另一个逐 token 写文字？顺便看懂物理观测、生成先验与后验推断。"
  tags:
    - "人工智能"
    - "生成模型"
    - "无线通信"
    - "大语言模型"
  body: |
    在 MIMO 信道估计中使用扩散模型（Diffusion Model, DM）或流匹配（Flow Matching, FM），与使用 GPT 一类大语言模型（LLM）聊天，表面上很不一样：前者输出复数信道矩阵，后者输出文字。然而，它们有一条共同的主线：**不必手工写出真实世界中复杂数据分布的完整公式，而是用神经网络从样本中学习它。**

    ### 一、共同的出发点：学习分布

    对无线信道，感兴趣的是信道矩阵 **H ∈ ℂ^(Nᵣ×Nₜ)** 的统计规律，可记为 **p(H)**；对文本，感兴趣的是 token 序列 **x₁, x₂, …, xₜ** 的联合分布 **p(x₁, …, xₜ)**。

    两者都属于广义的深度生成建模，但选择了不同的建模与采样方法：

    | 对比维度 | 生成式 MIMO 信道建模 | GPT 类 LLM |
    | --- | --- | --- |
    | 数据对象 | 连续值复数矩阵（可拆成实部和虚部） | 离散 token 序列 |
    | 典型建模方式 | Diffusion、Flow Matching | 自回归（autoregressive） |
    | 网络预测内容 | 噪声、score 或 velocity field | 下一个 token 的概率分布 |
    | 典型生成方式 | 整个高维状态逐步去噪／沿 ODE 演化 | 一个 token 接一个 token 生成 |
    | 常见指标 | NMSE、物理一致性、分布统计 | 交叉熵、任务正确率、指令遵循等 |

    ### 二、两个「时间」，根本不是一回事

    Flow Matching 可以学习一个连续向量场 **vθ(Hₜ, t, c)**，通过 **dHₜ/dt = vθ(Hₜ, t, c)** 把简单先验样本运输成符合目标分布的信道样本；条件 **c** 可来自场景参数或观测信息。Diffusion 则通常学习去噪或 score，并借助逐步采样完成生成。

    GPT 类语言模型的核心分解则是：

    > **p(x₁, …, xₜ) = ∏ᵢ p(xᵢ | x₁, …, xᵢ₋₁)**

    它根据已有 token 预测下一位置的概率分布，再从中选择或采样。**Flow 里的 t 是构造的概率路径时间；LLM 的 i 是真实序列位置**。生成一整个矩阵与逐个生成文字 token，不能因为都叫 generative AI 就视为同一种计算。

    ### 三、信道估计还多了一条物理约束

    信道生成本身可以只学习 **p(H)**；但信道估计是一类**逆问题（inverse problem）**。例如采用导频观测模型：

    > **Y = HP + N**

    其中 **P** 是已知导频，**Y** 是接收观测，**N** 是噪声。目标不只在于生成一幅「长得像信道」的矩阵，而是恢复与实际观测相符的 **H**。贝叶斯形式为：

    > **p(H | Y, P) ∝ p(Y | H, P) · p(H)**

    这就把两种知识组合起来了：**数据驱动的生成先验 p(H)**，以及**由通信物理模型和噪声假设给出的似然 p(Y | H, P)**。实际算法可能通过导频一致性、后验引导或近似优化使用它们，并不保证精确计算了后验分布。

    普通聊天式 LLM 则通常直接建模「给定 prompt 后如何生成答案」；它没有一个像 **Y = HP + N** 那样普遍适用、可计算残差的外部物理观测模型。因此，**pilot consistency** 与语言中的「语义自洽」并非同一种严格约束。

    ### 四、别把网络骨干和生成原理混为一谈

    **Transformer 是网络架构，不等于自回归生成；Flow Matching 是训练连续流的范式，也不等于某个特定 U-Net。** 因此完全可以用 Transformer 作为 Flow 模型的 backbone，也可以用卷积网络预测 velocity。多模态模型则可能进一步混合文本自回归与连续潜空间生成。

    两条路线更深的相似处是：**为了降低训练损失，模型需要学会数据中的隐藏结构**。信道模型可能学到空间相关性、多径和角域结构；语言模型则可能学到句法、语义、常识与对话意图。训练对象不同，涌现出的可用表征也不同。

    可以把整件事压成一句话：

    > **信道生成式 AI：复杂连续分布 + 生成先验 + 物理观测约束；GPT 类 LLM：离散自回归分布 + 海量语言预训练 + 后训练与上下文条件。**

    同属生成模型大家族，但绝不是「把信道矩阵换成文字」就能互相改造的同一套算法。
  sources:
    - label: "Ho et al. (NeurIPS 2020)：Denoising Diffusion Probabilistic Models"
      url: "https://arxiv.org/abs/2006.11239"
    - label: "Lipman et al. (ICLR 2023)：Flow Matching for Generative Modeling"
      url: "https://arxiv.org/abs/2210.02747"
    - label: "Brown et al. (NeurIPS 2020)：Language Models are Few-Shot Learners"
      url: "https://arxiv.org/abs/2005.14165"
    - label: "Xu et al.：Generative AI for Mobile Communications—A Diffusion Model Perspective"
      url: "https://arxiv.org/abs/2410.06389"

- slug: "true-name-magic"
  added_at: "2026-10-12T11:50:00+08:00"
  title: "为什么知道「真名」就能支配魔物？"
  english: "True Name Magic / The Power of Names"
  teaser: "从伊西斯套出拉神的秘密名字，到《地海传奇》《真名实姓》《神经浪游者》：古老的「名字即本质」观念，怎样一路变成了赛博空间里的身份与权限隐喻。"
  tags:
    - "神话与民俗"
    - "奇幻文学"
    - "科幻"
    - "信息安全"
  body: |
    「知道某个存在的真名，就能召唤、束缚或支配它」并不是某一部现代奇幻作品发明的设定。更准确地说，它是一个**非常古老、而且跨文化反复出现的母题**：名字并不只是方便称呼的标签，而被看作人与神、精灵乃至事物之**身份、本质或存在的一部分**。于是自然会得到一个很有魔法味的推论：

    > **知道真正的名字** → **准确触及其身份 / 本质** → **获得某种力量**

    ### 一、古老版本：名字不是标签，而是「本体的一部分」

    一个非常早、而且材料保存得相当清楚的例子来自**古埃及**。在「伊西斯与拉神之名」（Isis and the Name of Ra）的故事中，伊西斯设法让太阳神拉中毒，并以治疗为条件逼迫拉透露自己的**秘密名字**。拉之所以不愿说，正因为秘密名字意味着力量；伊西斯得到名字之后，也就取得了原本不属于她的神圣知识与权能。

    这种思路并不限于埃及。语言学、人类学和宗教史材料中，可以看到许多社会存在**真名、秘名、避讳姓名**之类的习俗：若名字被视为与本人不可分割，那么「让别人知道名字」就不只是泄露一串字符，而近似于把自己的一部分交到别人手里。

    因而这里真正古老的核心不是「恶魔有一串隐藏密码」，而是：

    **名字 ≈ 身份 ≈ 本质。**

    ### 二、欧洲民间故事：猜出名字，就能解除对方的力量

    《格林童话》的**侏儒怪（Rumpelstiltskin）**是最著名的例子之一。王后只有猜出神秘小人的名字，才能摆脱契约、保住孩子。英国民间故事 **Tom Tit Tot** 也有相似结构。

    这时「真名魔法」已经非常接近现代奇幻熟悉的形式：神秘存在拥有一个不轻易公开的名字，而**识破名字本身就是破解它的弱点**。

    不过要注意，后世常见的「知道恶魔真名 = 自动获得绝对控制权」并不是某一部《圣经》直接写下的一条统一规则。古代晚期以及后来的驱魔、仪式魔法传统中，**名字本身具有施力效果**的观念极强：仪式会反复使用神、天使、灵体的名字；有时要问出灵体的名字，有时则借更高位神圣之名命令它。现代奇幻把这些复杂传统压缩成了一个极其好用的规则：

    > **真名就是控制接口。**

    ### 三、《地海传奇》：把民间母题系统化成一套世界规律

    厄休拉·勒古恩在 **《地海传奇》**中把这一传统发展得格外完整。地海的魔法并不只是念咒，而建立在**知道万物在古语（Old Speech）中的真名**之上；人的真名也因此极其私密，把真名告诉别人意味着高度信任，同时也暴露了自己。

    勒古恩本人网站上的相关讨论甚至直接指出，《地海巫师》中寻找影子真名的情节，会令人想到 **Rumpelstiltskin**、**Tom Tit Tot** 等民间故事。换句话说，地海并非凭空发明「真名」观念，而是把古老母题做成了一套非常漂亮的**语言—本体论魔法系统**：

    > **正确命名事物** ≈ **正确认识事物** ≈ **能够作用于事物**

    ### 四、《真名实姓》：真名魔法被翻译成了信息安全

    弗诺·文奇的 **《真名实姓》（True Names, 1981）**做了一次极聪明的现代化：故事里的黑客在网络空间中使用化名，以巫师、术士般的形象活动；所谓 **True Name** 却不是什么神秘咒文，而是他们在现实世界中的**真实身份**。

    一旦政府或敌人查出了某个网络巫师的真名，就能找到现实中的肉身、住址和社会身份，从而逮捕、威胁或胁迫他。古代魔法中的

    **知道真名** → **支配巫师**

    被文奇几乎原样映射成了

    **去匿名化（deanonymization）** → **现实世界中的可定位、可追责、可胁迫**

    于是「真名」从**本体论弱点**变成了**信息安全弱点**。这也是为什么这篇小说后来会被不断拿来讨论网络匿名、隐私和身份安全。

    ### 五、《神经浪游者》：吉布森干脆把这层对应关系说破了

    到 **《神经浪游者》（Neuromancer, 1984）**，这种古老魔法与计算机世界的对应已经近乎明示。Neuromancer 对 Case 谈到：古人幻想召来恶魔需要知道它的名字，而 Case 的职业恰恰就是寻找那些所有者试图隐藏的**程序正式名称**；随后话题又落到 AI 自己的「名字」上。

    因此这里的「恶魔」其实就是软件、AI 与赛博空间实体的隐喻。吉布森利用了一个读者早已熟悉的文化直觉：

    **知道名字 = 能够准确指认那个东西 = 有机会调用、攻击或控制那个东西。**

    ### 六、从魔法到计算机，其实只换了一层解释

    这条母题之所以特别适合被赛博朋克继承，是因为现代计算机系统里「名字」真的经常具有操作意义：用户名、域名、进程名、接口名、地址、密钥标识、真实身份……它们当然不是魔法真名，但都承担着**从抽象对象定位到具体对象**的作用。

    可以把几千年的变化压缩成两条式子：

    > **古代魔法：** 名字 → 本质 → 力量

    > **赛博空间：** 标识 / 身份 → 可定位性 → 权限或攻击面

    所以《地海传奇》《真名实姓》和《神经浪游者》看起来像在共享一个「召唤恶魔要知道真名」的设定，其实正好展示了同一个古老母题的三次变形：

    **民俗与仪式魔法的真名 → 奇幻世界的本体论规则 → 网络时代的身份、匿名与控制问题。**

    时间顺序上可以记成 **《地海巫师》（1968）→《真名实姓》（1981）→《神经浪游者》（1984）**。不过仅凭年代不能断言后两者一定直接借用了前者；更稳妥的说法是：三者都在调用并改造一个远比它们古老的文化母题。
  sources:
    - label: "UCL Digital Egypt：Isis and the Name of Ra"
      url: "https://www.ucl.ac.uk/museums-static/digitalegypt/literature/isisandra.html"
    - label: "Cambridge University Press：Taboo, naming and addressing"
      url: "https://www.cambridge.org/core/books/abs/forbidden-words/taboo-naming-and-addressing/6425BB6BE419E7110C992B5500233EA8"
    - label: "Ursula K. Le Guin 官网：Speculations on the Earthsea Stories"
      url: "https://www.ursulakleguin.com/on-earthsea-mahy"
    - label: "SIGCIS：True Risks? The Cultural History of Networked Identity"
      url: "https://www.sigcis.org/files/Abbate.pdf"
    - label: "AU Press：The Medium Is the Monster（Neuromancer 与 true name）"
      url: "https://read.aupress.ca/read/the-medium-is-the-monster/section/f589f6e9-6783-4725-af36-2cdf5d17a00e"

- slug: "lovecraft-six-stories"
  added_at: "2026-10-12T11:48:00+08:00"
  title: "洛夫克拉夫特六篇代表作：从怪奇神话到宇宙考古"
  english: "Six Lovecraft Stories: From Cosmic Horror to Alien Archaeology"
  teaser: "沿创作时间线读《克苏鲁的呼唤》《星之彩》等六篇：从禁书与邪神，到外星生命、史前文明与身份异化。"
  tags:
    - "文学史"
    - "克苏鲁神话"
    - "科幻与恐怖"
  body: |
    **剧透提醒：以下涉及六篇小说的主要谜底和结尾。** 这里按**创作时间**，而非发表时间排列。六篇写于 1926—1931 年，可以看出洛夫克拉夫特（H. P. Lovecraft）如何在哥特恐怖、怪奇小说（Weird Fiction）与早期科幻之间反复探索。它们并非一条剧情连续的“六部曲”，也不是风格只朝着科幻单向进化。

    ### 一、创作时间线

    | 创作时间 | 作品 | 最值得注意的写法 |
    | --- | --- | --- |
    | **1926 年夏** | 《克苏鲁的呼唤》（The Call of Cthulhu） | 档案拼接、邪教与宇宙尺度的真相 |
    | **1927 年 3 月** | 《星之彩》（The Colour Out of Space，亦译《来自群星的颜色》） | 没有明确邪神的未知自然现象 |
    | **1928 年夏** | 《敦威治恐怖事件》（The Dunwich Horror） | 乡村怪谈、混血怪物与学者反击 |
    | **1930 年 2—9 月** | 《暗夜呢喃》（The Whisperer in Darkness） | 外星生物、脑部保存与星际技术 |
    | **1931 年 2—3 月** | 《疯狂山脉》（At the Mountains of Madness） | 南极科考、外星考古与文明兴衰 |
    | **1931 年末** | 《印斯茅斯的阴霾》（The Shadow over Innsmouth，亦译《印斯茅斯疑云》） | 衰败海港、非人血统与身份反转 |

    一个有趣的出版史错位：《星之彩》虽然写于《克苏鲁的呼唤》之后，却更早刊登在《Amazing Stories》（1927）；《疯狂山脉》则到 1936 年才在科幻杂志《Astounding Stories》上连载。因此，**创作顺序比发表顺序更适合观察作者的思想变化**。

    ### 二、1926：《克苏鲁的呼唤》——神话从零散档案里浮现

    **故事：** 叙述者整理亡故亲属留下的文件，发现雕像、艺术家的怪梦、路易斯安那秘密教团与太平洋航海事故，似乎都指向同一种巨大存在：克苏鲁。沉没古城拉莱耶一度浮出海面，船员误入其中，面对并非人类历史所能容纳的东西。

    **看点：** 真正有力的不是“章鱼头怪物登场”，而是分散于不同国家、年代、媒介的线索**最终互相印证**。作者借伪文献制造一种“我们所知的人类历史只是表层”的错觉。它奠定了后世最容易识别的克苏鲁符号，却也保留着浓厚的教团、仪式与禁书色彩。

    ### 三、1927：《星之彩》——不必有邪神，未知自然本身就很可怕

    **故事：** 一颗陨石坠落阿卡姆附近农场。科学家无法解释它的物理性质，随后当地出现无法归入已知光谱的异色、异常生长的植物、腐败的庄稼，以及人畜逐渐遭到侵蚀的现象。灾变似乎与农场的井及一种来自宇宙的东西有关。

    **看点：** 这里几乎没有教团或神话主角，也无法确定灾变是否出自某种有意识的恶意。作品从“远古神祇”转向**物理学、生物学与观测分类无法处理的异质现象**。恐怖不是科学无用，而是科学认真调查以后发现：已知理论的适用范围可能远比想象中狭窄。这是洛氏怪奇与科学小说交汇的典型。

    ### 四、1928：《敦威治恐怖事件》——教授们居然可以打败怪物

    **故事：** 偏僻山村里，威尔伯·惠特利以异常速度长大，试图获得米斯卡托尼克大学收藏的《死灵之书》。他死后暴露出非人的身体结构；而家中一直关着、体型更加庞大的孪生兄弟最终逃出，肆虐乡间。阿米蒂奇等学者通过古籍、粉末和咒语设法将它阻止。

    **看点：** 犹格·索托斯、禁书和异常血统让“神话”的联系更明显；但故事的剧情机制反而相当传统：**怪物出现 → 学者调查 → 找到应对方法 → 怪物被消灭**。这是后世克苏鲁调查员冒险模式的绝佳前驱，但不宜据此误认所有洛氏作品都主张“知识必然导致疯狂、反抗必然失败”。

    ### 五、1930：《暗夜呢喃》——“邪神眷族”突然有了外星科技

    **故事：** 民俗学者威尔马斯与佛蒙特隐居者阿克利通信，追查洪灾后流传的怪异生物传闻。阿克利先寄出照片、录音等证据，并声称遭到袭击，随后却突然改口说自己与这些生物达成和解。威尔马斯登门拜访，在昏暗房间里遇到一个声音奇怪、包裹严密的“阿克利”，最终发现可怕的伪装痕迹。

    **看点：** 米戈（Mi-Go）更像具备技术、社会活动和星际旅行能力的外星种族，而不只是宗教意义上的恶魔。最鲜明的点子是**将人脑保存于容器中，并连接感官装置进行旅行**。作品还把当时新发现的冥王星与虚构星球“犹格斯”（Yuggoth）联系起来：现实天文学新闻直接成为怪奇科幻的材料。

    ### 六、1931：《疯狂山脉》——从怪物故事转为外星文明考古报告

    **故事：** 南极探险队找到异常生物遗骸，继而发生惨烈事故。戴尔与丹福斯越过山脉，发现远古城市，通过建筑与壁画重建古老者（Elder Things）的历史：它们从宇宙而来，建立文明、进行生物工程、制造修格斯作为劳动力，并经历战争、衰败与造物反抗。

    **看点：** 如果说先前的小说在“揭露神秘”，这一篇就在**重建历史**。地质学、古生物学、建筑和壁画成了叙事工具。古老者最初被当成怪物，随后却显露出艺术、技术、社会和历史，甚至逐渐赢得叙述者的同情。这也是外星考古（xenoarchaeology）式科幻的早期重要范例；不能把其中所有存在一概化为“外星人”，但许多神话意象的确获得了物质化、历史化解释。

    ### 七、1931：《印斯茅斯的阴霾》——宇宙尺度重新缩回一个人的身体

    **故事：** 一名热衷旅行、古建筑和家族史的青年进入衰败海港印斯茅斯，察觉当地人外貌异样、行为封闭，并从老人讲述中听到渔获、黄金、达贡密教及人类与深潜者通婚的秘密。他夜里逃出小镇，后来调查自己的家谱，却发现自己也继承了那种非人血统。结尾他不再只想逃离，而开始向往海底世界。

    **看点：** 这里没有继续扩大《疯狂山脉》的宇宙史，反而把未知压缩成**地方史 → 家族史 → 身体 → 自我认同**。后半段的逃亡戏比多数洛氏故事更有动作性；结尾却将“害怕异类”翻转成“我就是异类”。作品同时带有鲜明的血统、族群混合与退化焦虑，阅读时应将这种历史文化背景与对文本结局的解释区分开来。

    ### 八、把六篇并排，会出现怎样的演变？

    可以概括成三条**相互交叉、并非单向递进**的写作路线：

    1. **档案与神话：**《克苏鲁的呼唤》 → 《敦威治恐怖事件》。前者让多个证据共同指向不可知的历史，后者把禁书、异类血统和大学学者进一步戏剧化。
    2. **未知自然与科幻：**《星之彩》 → 《暗夜呢喃》 → 《疯狂山脉》。从无法归类的外来现象，走向具有技术的外星种族，再到可以用遗迹重建的史前文明。
    3. **地方哥特与身份恐怖：**《敦威治恐怖事件》 → 《印斯茅斯的阴霾》。同样有乡镇、禁忌与非人后代，前一篇由人类学者消灭威胁，后一篇则让叙述者接受自己与“异类”的关系。

    所谓“克苏鲁式恐怖”，并不只是**看见不可名状的大鱿鱼 → SAN 值骤降 → 发疯**。那是后世大众文化与桌游机制的一种简便概括。原作更耐人寻味的路径往往是：

    **发现异常 → 收集证据 → 得出解释 → 发现人类既有的自然观、历史观或身份认同需要重写。**

    这也是洛夫克拉夫特处在**哥特文学、怪奇文学、恐怖文学与早期科幻交汇处**的原因：怪物固然醒目，但真正重要的是，怪物的存在究竟迫使人类重新认识了什么。

