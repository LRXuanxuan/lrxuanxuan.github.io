- slug: "bradbury-exiles-hawthorne-tribute"
  added_at: "2026-10-12T15:10:10+08:00"
  title: "布拉德伯里的火星文学流亡者：向霍桑、坡与幻想文学致敬"
  english: "Ray Bradbury's The Exiles: A Tribute to Hawthorne and the Gothic Tradition"
  teaser: "当地球禁止幻想文学，坡、比尔斯等作家竟带着笔下人物流亡火星；霍桑的《拉帕奇尼的女儿》也在最后的禁书名单上。这是怎样一封写给文学祖先的情书？"
  tags:
    - "科幻文学"
    - "雷·布拉德伯里"
    - "霍桑"
    - "美国哥特文学"
    - "文学史"
  body: |
    如果读《火星编年史》的相关扩充版本时，遇到一群早已去世的文学家躲在火星上与地球宇航员对抗的故事，不妨留意其中的名字：**埃德加·爱伦·坡（Edgar Allan Poe）、安布罗斯·比尔斯（Ambrose Bierce）、狄更斯、莎士比亚，以及纳撒尼尔·霍桑（Nathaniel Hawthorne）**。

    雷·布拉德伯里（Ray Bradbury）的这篇短篇通常题为**《流亡者》（The Exiles）**，最初以 **The Mad Wizards of Mars** 为题发表于1949年9月15日的《麦克林》杂志（Maclean's），1950年经修订再版，1951年收入短篇集《绘图人》（The Illustrated Man）。

    有个容易混淆的版本问题：**它不在1950年《火星编年史》（The Martian Chronicles）的原始固定篇目中**，但2009年《火星编年史：完整版》（The Complete Edition）将它收入附加的「其他火星故事」。所以在某些版本中读到它，并不意味着所有版本的目录都一样。

    ### 一、禁书者统治地球，幻想作家只好逃往火星

    故事设想，地球社会把鬼怪、魔法、恐怖和超自然想象视作必须清除的东西，焚毁了大量相关书籍。那些作品创造出来的人物和世界，连同作者的幽灵，便在火星上获得了最后的避难所。

    一艘地球火箭接近火星时，船员接连遭遇无法解释的幻觉与死亡。另一边，火星上的坡、比尔斯和其他流亡者正在组织抵抗；《麦克白》里的女巫、文学作品中的妖魔鬼怪，也被拉进了这场保卫幻想世界的战争。

    最奇妙的规则是：**作家的存在依赖于地球上仍有人保存、阅读他们的作品。**每当最后的书本被毁，一个原本鲜活的文学幽灵就可能从火星上消失。

    > 地球上的最后一本书被焚毁 → 火星上的作者及其幻想世界失去存续的凭依。

    这当然不是一套物理学，而是把「文学活在读者记忆中」变成故事里的客观规律。火星不只是另一个星球，还成了人类想象力的最后栖息地。

    ### 二、霍桑在哪里？比「本人登场」更准确的细节

    故事真正拥有大量戏份的是坡、比尔斯等人。**霍桑并没有像坡一样获得独立的对话场景**，但他被明确纳入这群遭禁的文学前辈。

    地球飞船上列出最后一批禁书时，书单包括霍桑的 **《拉帕奇尼的女儿》（Rappaccini's Daughter）**。坡在谈及地球人的极端理性主义时，也把霍桑与自己、比尔斯、阿尔杰农·布莱克伍德并列，作为那些已经变成禁忌的文学名字。

    选中《拉帕奇尼的女儿》尤其耐人寻味：霍桑在这篇1844年的作品中，写一个被父亲的植物实验改变身体的少女，牵涉科学探索、控制欲、爱情和道德代价。它不是反对知识的简单宣传，而是一则带着哥特气息的**科学与伦理寓言**。

    因此，这里的霍桑之名并非无关紧要的背景板；它提示了布拉德伯里所敬爱的文学谱系。

    ### 三、布拉德伯里为什么会与霍桑如此亲近？

    布拉德伯里在《巴黎评论》的访谈中谈到自己特别看重**隐喻（metaphor）**：好的故事未必需要先把技术机制解释得毫无漏洞，而可以从一个难忘的象征性意象生长出来。他把**坡、梅尔维尔、华盛顿·欧文和霍桑**并列为这类作家。

    对照两人的故事，会发现相似的写法：

    - **霍桑《牧师的黑面纱》**：一个牧师始终戴着黑面纱；「面纱是什么」比「面纱如何制造」更重要。
    - **霍桑《拉帕奇尼的女儿》**：一座奇异花园与一名少女，承载科学、占有和伦理的冲突。
    - **布拉德伯里《流亡者》**：被烧掉的书真的使作者死亡；文学记忆与想象力的消亡被写成可见的灾难。

    这条线索可以概括为：**美国浪漫主义与哥特传统 → 寓言、象征、道德焦虑 → 布拉德伯里笔下的未来与火星。**

    这不意味着布拉德伯里只受霍桑影响，或者《流亡者》是一篇专门写给霍桑的作品。更准确地说，**它是向一整群幻想文学祖先的集体致敬**，而霍桑正是其中的重要成员。

    ### 四、为什么一篇「科幻」在保护鬼魂和巫术？

    这也是故事最有趣的反讽：地球人拥有火箭、医学和仪器，却被写成容不下想象的文明；流亡火星的旧作家们看似迷信、陈旧，反而捍卫文学和精神生活的丰富性。

    不过，**故事讽刺的是将理性与技术崇拜变成排他性教条的极端社会，并不等于证明科学本身应当让位于迷信。**布拉德伯里有意将矛盾戏剧化，让现代技术文明与旧日哥特幻想面对面相撞。

    也正因此，理解布拉德伯里不必只沿着「科幻小说如何预测未来」这条路。对于《火星编年史》及其相关火星故事，常常还需要另一张地图：

    > 火箭和火星提供舞台；霍桑式寓言、坡式哥特与人类的情感记忆，才是许多故事真正的内核。

    另见豆知识：[霍桑与梅尔维尔：两位大作家在海边谈论信仰](/tidbits/#hawthorne-melville-faith-conversation)。
  sources:
    - label: "《流亡者》初刊与《火星编年史》版本资料：Bradbury Media"
      url: "https://www.bradburymedia.co.uk/books/chron.htm"
