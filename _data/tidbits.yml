- slug: "common-logic-symbols"
  added_at: "2026-10-12T11:44:00+08:00"
  title: "常用逻辑符号"
  english: "Common Logical Symbols / Logic Notation"
  teaser: "¬、∧、∨、→、∀、∃……给数学证明与逻辑推理备一张可随手翻阅的符号表。"
  tags:
    - "逻辑学"
    - "数学"
    - "符号速查"
  body: |
    看数学证明、逻辑学或计算机论文时，总会碰见一些长得像神秘仪式的符号。其实大部分只是在简洁地表达“不是”“并且”“存在”与“推出”。

    ### 1. 命题逻辑：真假如何组合

    设 `P` 和 `Q` 是两个可以判断真假的命题。

    | 符号 | 读法／含义 | 例子或说明 |
    | --- | --- | --- |
    | **¬P** | 非、否定（NOT） | P 不成立 |
    | **P ∧ Q** | 且（AND） | P 与 Q 都成立 |
    | **P ∨ Q** | 或（OR） | 至少一个成立，也允许两个都成立 |
    | **P ⊕ Q** | 异或（XOR） | 恰好一个成立 |
    | **P → Q** | 蕴含（Implication） | 若 P，则 Q |
    | **P ↔ Q** | 双条件（Biconditional） | P 当且仅当 Q |
    | **⊤、⊥** | 真、假 | 常用于表示真值常量 |

    容易踩坑的是：**∨ 通常是包容性的“或”**；以及**“P → Q”本身不声明因果关系**。在经典命题逻辑中，只有 P 真而 Q 假时，P → Q 才是假；当前件 P 假时，整个蕴含式为真。

    ### 2. 谓词逻辑：到底对谁成立

    | 符号 | 名称 | 意思 |
    | --- | --- | --- |
    | **∀** | 全称量词（For all） | 对所有、任意 |
    | **∃** | 存在量词（There exists） | 至少存在一个 |
    | **∃!** | 唯一存在 | 存在且仅存在一个 |
    | **∄** | 不存在 | 不存在满足条件的对象 |

    例如，“∀x∈ℝ，x²≥0”表示所有实数的平方都非负；“∃x∈ℝ，x²=4”表示至少存在一个实数的平方为 4。

    **量词的次序不能随意交换**：

    - **∀x∈ℝ，∃y∈ℝ，y>x**：对每个 x，都能找到比它更大的 y（真）。
    - **∃y∈ℝ，∀x∈ℝ，y>x**：存在一个比所有实数都大的 y（假）。

    ### 3. 证明与推导里常见的记号

    | 符号 | 常见含义 |
    | --- | --- |
    | **⇒、⇐** | 推出、反向推出 |
    | **⇔、iff** | 等价、当且仅当（if and only if） |
    | **∴、∵** | 因此、因为 |
    | **≡** | 恒等或逻辑等价等，依上下文而定 |
    | **⊢** | 语法可推导：依据形式规则能够证明 |
    | **⊨** | 语义蕴涵：在所有相关模型中都成立 |
    | **□、Q.E.D.** | 证毕（这里 □ 是证明结束标记） |

    别把所有“箭头”都当成一个意思：**P → Q** 通常是逻辑语言内部的公式；**P ⇒ Q** 在数学文章里常用于叙述推导，具体用法依作者而异；**P ⊢ Q** 强调形式证明；**P ⊨ Q** 强调语义上的必然成立。

    ### 4. 常与逻辑符号一起出现的集合记号

    **∈** 属于，**∉** 不属于，**⊆** 子集，**⊊** 真子集，**∪** 并集，**∩** 交集，**∅** 空集。

    它们与逻辑运算天然对应：**x∈A∩B** 等价于“x∈A 且 x∈B”；**x∈A∪B** 等价于“x∈A 或 x∈B”。

    ### 5. 三组特别好用的等价关系

    - **德摩根律**：¬(P ∧ Q) ≡ (¬P ∨ ¬Q)；¬(P ∨ Q) ≡ (¬P ∧ ¬Q)。
    - **蕴含与逆否**：P → Q ≡ ¬P ∨ Q ≡ ¬Q → ¬P。
    - **量词否定**：¬(∀x，P(x)) ≡ ∃x，¬P(x)；¬(∃x，P(x)) ≡ ∀x，¬P(x)。

    最后一组翻译成人话尤其好记：**“不是所有”＝“至少一个不是”；“一个都没有”＝“所有都不是”。**

    写 LaTeX 时，常用命令包括 `\neg`、`\land`、`\lor`、`\to`、`\leftrightarrow`、`\forall`、`\exists`、`\Rightarrow`、`\Leftrightarrow`、`\vdash`、`\models`。不必背全，先掌握 **¬、∧、∨、→、↔、∀、∃** 这七个核心符号，已经能读懂大量基础逻辑表达式。

- slug: "ai-software-vs-hardware"
  added_at: "2026-10-12T11:43:00+08:00"
  title: "AI 史上的「软件派」与「硬件派」"
  english: "Software-centric AI vs. Specialized AI Hardware"
  teaser: "造出智能，究竟主要靠写出正确的程序，还是得先造一台特别的机器？"
  tags:
    - "人工智能史"
    - "计算机架构"
    - "技术史"
  body: |
    人工智能的发展史里，有一条很有意思的长期分歧。粗略说来：

    > **智能主要来自可编程的算法／表征**  
    > **VS**  
    > **智能需要特殊的物理结构／计算架构**

    早期**符号主义 AI**相信，可以在通用数字计算机上，通过符号表示、逻辑规则和搜索程序实现智能。Newell 与 Simon 在 1976 年提出的**物理符号系统假说**，正是这一思路的代表。

    但另一种工程直觉是：既然智能计算有自己的特点，为什么非得迁就普通计算机？1980 年代的 **Lisp Machine**，以及日本自 1982 年启动的**第五代计算机计划**，都尝试为 AI 所需的编程语言、逻辑推理或并行处理设计专门的机器。后来，通用计算机的进步和规模经济，让不少早期 AI 专机失去了优势。

    看起来，2010 年代的深度学习革命像是一次「软件派胜利」：2012 年的 **AlexNet** 没有依赖某种神秘的仿生大脑，而是在 GPU 上训练神经网络。不过，它恰恰也提醒我们：**算法、数据和算力缺一不可**。GPU 提供的大规模并行计算，是突破的重要条件。

    故事还有一个反转：深度学习成功之后，专用 AI 硬件反而复兴了。Google 的 **TPU** 自 2015 年起用于数据中心，把已经证明有效的神经网络计算进一步做成了专用加速器。

    所以，这并不是「软件最终消灭硬件」的故事。更贴切的说法是：**智能算法可以脱离某一种特定的机器结构来研究和实现；但要让它运行得足够快、足够省电，计算架构仍然举足轻重。**

    另外，**「软件与专用硬件」**和**「符号主义与连接主义」**是两组不同的问题：前者谈如何实现和加速，后者谈智能如何表示与学习。它们常在历史上交错，却并不是同一场论战。

    从「为了 AI 造机器」，到「先让 AI 算法成功，再为它造更合适的机器」，这段历史实在很有循环往复的喜感。😼
  sources:
    - label: "Newell & Simon (1976)：Computer Science as Empirical Inquiry"
      url: "https://doi.org/10.1145/360018.360022"
    - label: "日本信息处理学会：第五代计算机计划"
      url: "https://museum.ipsj.or.jp/en/computer/other/0002.html"
    - label: "Krizhevsky et al. (2012)：AlexNet"
      url: "https://papers.nips.cc/paper_files/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html"
    - label: "Google (2017)：TPU 研究介绍"
      url: "https://cloud.google.com/blog/products/gcp/quantifying-the-performance-of-the-tpu-our-first-machine-learning-chip"

- slug: "tautological-place-names"
  added_at: "2026-10-12T11:28:00+08:00"
  title: "同义反复地名／地名赘语现象"
  english: "Tautological place name / Toponymic pleonasm"
  teaser: "一座山被不同语言反复命名，最后竟然真的叫成了「山山山」。"
  tags:
    - "语言学"
    - "地名学"
    - "词源"
  body: |
    假设某地在当地语言中叫“山”。外来者不知道这个名字本身就有“山”的意思，只把它当作一个专有名称，于是又添上自己语言里的“山”。后来的人再来一次，便有了“山山山”。

    这种由不同语言重复表达同一含义的名称，称为**同义反复地名**（tautological place name）；从“添加了语义重复成分”的角度，也可以用**地名赘语**（toponymic pleonasm）来描述。

    - **Pendle Hill（英国彭德尔山）**：名称中的 *pen* 来自古老的布立吞语系词汇，与“山、山顶”有关；后来加上古英语 *hyll*（山），再加上现代英语 *hill*（山）。按词源拆解，几乎就是“山山山”。
    - **River Avon（英国埃文河）**：*Avon* 源于古布立吞语中表示“河流”的词，与威尔士语 *afon* 同源；前面再加英语 *river*，便成了“河河”。

    它并非单纯的翻译失误。随着语言更替，原先能听懂的普通名词变成了词义不透明的地名；后来的使用者添上熟悉的类别词，反而能让名字更容易理解。

    所以，一个看似累赘的地名，也可能是一块小小的**语言地层化石**：每一次“多此一举”，都留下了历史上不同语言群体使用它的痕迹。
  sources:
    - label: "Pendle Hill Project：The hill they named three times"
      url: "https://www.pendlehillproject.com/sites/default/files/docs/Final%20Sense%20of%20Place%20Toolkit.pdf"
    - label: "River Avon：Etymology"
      url: "https://en.wikipedia.org/wiki/River_Avon,_Warwickshire"
