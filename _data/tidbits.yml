  body: |
    ## 专门给科幻史「沧海遗珠」补票的奖
    
    **科德韦纳·史密斯再发现奖（Cordwainer Smith Rediscovery Award）**创立于2001年，由科德韦纳·史密斯基金会设立，以科幻作家 Cordwainer Smith 为名，通常在科幻文学聚会 Readercon 颁发。它不是按年度评选某部新小说，而是由评委选出**值得重新被读者关注、却未得到相称关注的科幻与奇幻作家**，性质更接近对整个创作生涯的重新评价。
    
    这个名字还有一层巧合：Cordwainer Smith 的作品体系里本来就有著名的 *The Rediscovery of Man*（「人类的再发现」）题名。奖项仿佛也在做一件类似的事——回头从浩如烟海的类型文学中，重新找回那些被文学史筛选过程遗漏的人。
    
    许多得主已经去世，但**并非必须追授**；2011年的 Katherine MacLean 就是在世时获奖。2001年首届颁给 Olaf Stapledon；2022年因 Readercon 取消而空缺。截至2026年，最新得主为 Suzette Haden Elgin。
    
    这个奖的趣味恰恰在于：**有的人从来没红过，有的人曾经红得惊人，还有的人影响力巨大，名字却渐渐被后来的作品遮住。**因此它不是「历年最好的科幻作家」排行榜，而是一份理解科幻名声如何形成、消退和被重估的参考名单。
    
    ## 历届得主：2001—2026
    
    以下以获奖年份为序。所附作品是**入门线索，不是该奖针对某一本书颁发的获奖作品**；英文题名优先保留，避免不同中文译本造成混淆。
    
    ### 2001—2008：重新辨认早期巨匠与开创者
    
    - **2001 · Olaf Stapledon（奥拉夫·斯特普尔顿）**——《最后与最初的人》（*Last and First Men*）、《造星主》（*Star Maker*）。把人类史写到千万年、亿年尺度，乃至宇宙心智与文明演化。不是专业科幻史上的无名之辈，而是「重要到近乎祖师，却不一定有许多当代读者真正读过」。
    - **2002 · R. A. Lafferty**——*Nine Hundred Grandmothers* 等短篇。口述神话、荒诞幽默、逻辑跳跃与离奇语言混合；他的怪异不是点缀，而是整个叙事方式。
    - **2003 · Edgar Pangborn**——*Davy*、“Angel's Egg”。在后末日和异种接触中强调普通人的伦理、温情与文明复苏，是容易被技术奇观遮住的人文主义一支。
    - **2004 · Henry Kuttner 与 C. L. Moore**——“Mimsy Were the Borogoves”、“Vintage Season”、“Shambleau”等。黄金时代出色的创作搭档，也各有重要个人作品；因为大量使用笔名、共同写作，作品归属和个人声誉的传播更复杂。
    - **2005 · Leigh Brackett**——Eric John Stark 行星冒险故事、*The Long Tomorrow*。把硬汉小说的节奏带进行星传奇；她也是《夜长梦多》《赤胆屠龙》等影片的编剧，并参与《帝国反击战》早期剧本。
    - **2006 · William Hope Hodgson**——*The House on the Borderland*、*The Night Land*。海洋怪奇、远未来宇宙黑暗与超自然恐怖的早期先驱；不能只把他当成洛夫克拉夫特之前的过渡人物。
    - **2007 · Daniel F. Galouye（丹尼尔·F·加卢耶）**——《三重模拟》（*Simulacron-3*）、*Dark Universe*。1964年就把计算机社会模拟、数字居民和嵌套现实组织成成熟故事；前者后来被改编成法斯宾德的《世界旦夕之间》与《异次元骇客》。
    - **2008 · Stanley G. Weinbaum**——“A Martian Odyssey”。1934年以真正陌生的外星生物、不同的感知与认知方式轰动科幻界，却于1935年早逝；是创作生命遭突然截断的典型。
    
    ### 2009—2016：昔日畅销作者、短篇高手与编辑
    
    - **2009 · A. Merritt**——*The Moon Pool*、*The Metal Monster*。当年的通俗幻想巨星，擅长失落文明、神秘遗迹与壮丽奇观；他提醒我们「当年极红」并不保证「后世仍红」。
    - **2010 · Mark Clifton**——与 Frank Riley 合著 *They'd Rather Be Right*。把心理学、组织、人事管理和社会工程写进坎贝尔时代的科幻；这部作品曾获得雨果奖，不能简单归入「生前毫无荣誉」。
    - **2011 · Katherine MacLean**——“The Snowball Effect”、*Missing Man*。用心理学、社会学与科学方法处理群体行为和人的认知，是早期社会科学科幻的重要代表。
    - **2012 · Fredric Brown**——“Arena”、“Answer”、*Martians, Go Home*。擅长极短篇、黑色幽默和一句话翻盘的结尾：篇幅可能很小，概念的传播力却极强。
    - **2013 · Wyman Guin**——“Beyond Bedlam”。作品数量不多，却写出把心理状态、药物和社会秩序绑在一起的惊人反乌托邦；也特别容易因没有长篇代表作而被忽略。
    - **2014 · Mildred Clingerman**——*A Cupful of Space* 等短篇。以家庭、日常经验为入口，让熟悉的生活悄悄显出不安与异样。**注意：某些得主汇总表漏列这一届，并不代表当年停奖。**
    - **2015 · Clark Ashton Smith**——Zothique（佐西克）、Hyperborea（亥伯里亚）故事。与洛夫克拉夫特、罗伯特·E·霍华德同为 *Weird Tales* 的关键人物，尤其以瑰丽而浓艳的文字见长。
    - **2016 · Judith Merril**——“That Only a Mother”，以及长期主持的年度科幻选集。她不仅是小说家，更是编辑、评论家与新科幻趣味的推动者；她对「哪些作品会被人读到」本身就产生了影响。
    
    ### 2017—2026：类型史边缘、媒介焦虑与重新发掘
    
    - **2017 · Seabury Quinn**——Jules de Grandin 系列。昔日 *Weird Tales* 的明星作者，超自然侦探故事极受欢迎；今天却远不如同刊的洛夫克拉夫特等人知名。
    - **2018 · Frank M. Robinson**——*The Power*、*The Dark Beyond the Stars*。心理惊悚、技术灾难与星际航行题材兼擅，职业经历也横跨小说、编辑及公共事务。
    - **2019 · Carol Emshwiller**——短篇作品与长篇 *The Mount*。擅长以陌生视角、寓言与文学实验重塑熟悉的权力关系；不是以宏大技术设定取胜的作者。
    - **2020 · Rick Raphael**——*Code Three*、“The Thirst Quenchers”。很有特色的专业技术人员科幻：高速公路执法、水资源管理、日常维护与大型工程系统，重点是专业能力如何支撑文明。
    - **2021 · D. G. Compton**——*The Continuous Katherine Mortenhoe*。把记者的眼睛变成摄像机，把绝症患者的人生变成电视节目；小说改编为《死亡直播》（*Death Watch*, 1980），在真人秀与无处不在的摄像头时代显得格外尖锐。
    - **2022 · 未颁奖**——当年 Readercon 取消。
    - **2023 · Josephine Saxton**——*The Hieros Gamos of Sam and An Smith*。英国新浪潮的一支，偏寓言、内在空间与超现实叙事，读起来未必像传统「解决技术问题」式科幻。
    - **2024 · Clare Winger Harris**——“The Fate of the Poseidonia”。美国早期专业科幻杂志中开拓道路的女性作者之一；其历史意义也在于揭示早期科幻史并非完全由后来熟悉的男性黄金时代作家构成。
    - **2025 · Kris Neville**——“Bettyann”、“The Toy”。20世纪中叶富于想象力的短篇作者之一，作品的存续和流传度未能与创作才华完全匹配。
    - **2026 · Suzette Haden Elgin**——*Native Tongue* 系列。她是语言学家，还为小说构造了 Láadan 语言；重要的不仅是「发明几句外星话」，而是把语言结构、表达能力与社会权力直接变成科幻实验。
    
    ## 为什么「被遗忘」也有不同的含义？
    
    **第一种：祖师爷型。** 例如 Stapledon、Hodgson、Weinbaum。研究科幻史的人知道他们重要，但大众读者未必经常直接阅读原作。这不等于他们当年无人赏识。
    
    **第二种：昨日巨星型。** A. Merritt、Seabury Quinn 尤其典型。当年销量或杂志读者欢迎程度非常可观，如今的文化地位却被同期其他作者反超。**生前成名与身后入史，完全是两回事。**
    
    **第三种：杂志短篇型。** Wyman Guin、Mildred Clingerman、Kris Neville 等人的许多成绩分散在杂志、短篇集和绝版作品里。现代读者习惯通过一部长篇代表作认识作者，这种「检索习惯」本身就可能造成遗忘。
    
    **第四种：其他成就遮蔽型。** Leigh Brackett 的影视编剧声望、Judith Merril 的编辑与评论贡献，可能比她们作为小说家的某些作品更易被后世看见。
    
    **第五种：作品概念流传，作者姓名隐身。** Galouye 的《三重模拟》是极好的例子：模拟世界、数字生命和「我们的现实也可能是模拟」已是熟悉的科幻母题，许多人却不知道这个重要的早期文本是谁写的。D. G. Compton 的媒体监视寓言也有类似的「后来的现实追上早年的想象」效果。
    
    > **这个奖不是在证明：所有得主都比著名作家更好。它提醒我们：文学史留下的名字，不是按作品质量自动、无损地筛选出来的。**
    
    作品需要再版、选集、翻译、评论、影视改编、馆藏与读者社群才能持续传播。某个作者的名声减弱，既可能是审美标准变了，也可能只是出版与保存的渠道消失了。
    
    ## 从哪几个人开始读？
    
    如果偏好**宏大文明史与人类突破边界**，从 Stapledon 入手最合适，再试 Rick Raphael 那种专业人员维护技术文明的故事。
    
    如果更喜欢**巧妙、辛辣、概念密度高的短篇**，可以先读 Fredric Brown、Stanley G. Weinbaum，再试 Wyman Guin 和 R. A. Lafferty。后两者风格差距极大：一个写社会制度的诡异稳定，一个像神话与笑话发生了奇妙的短路。
    
    如果想追踪**后来成为经典的科幻母题从哪里长出来**，推荐 Galouye 的 *Simulacron-3*、Compton 的 *The Continuous Katherine Mortenhoe*、MacLean 的早期社会科学短篇。
    
    而 Smith、Hodgson、Merritt、Quinn 所在的怪奇幻想一支，则适合沿着 *Weird Tales*、洛夫克拉夫特及早期通俗杂志的谱系阅读。
    
    归根到底，**「再发现」不是给这些作品补发一张绝对正确的排行榜名次，而是把阅读选择权重新交给后来的读者。**
