- slug: "jaws-summer-blockbuster-and-cinema-history"
  added_at: "2026-10-12T13:59:30+08:00"
  title: "《大白鲨》：一条鲨鱼如何改写好莱坞"
  english: "Jaws (1975): B-Movie Roots, Summer Blockbusters & Film Canon"
  teaser: "明明是怪兽B级片的故事，却刷新票房纪录、重塑暑期档，还同时闯进AFI和《视与听》的经典榜单。"
  tags:
    - "电影史"
    - "好莱坞"
    - "暑期档"
    - "商业大片"
    - "电影语言"
  body: |
    1975 年，年仅 28 岁的史蒂文·斯皮尔伯格（Steven Spielberg）执导了**《大白鲨》（Jaws）**：一个海滨小镇遭到食人大白鲨袭击，警长、海洋学家和渔夫乘船出海追捕怪物。单看梗概，简直是标准的廉价怪兽电影。然而它既创造了当时的票房纪录，又帮助确立了现代好莱坞的**暑期商业大片（summer blockbuster）**模式，后来还成为影评人和导演共同认可的电影经典。

    ### 一、它到底是不是B级片？

    **更准确地说：《大白鲨》具有B级片的题材基因，但不是按廉价B级片规格制作、发行的电影。**食人怪兽、边缘小镇、逐个遇害的角色、最终与怪物决战，都是类型片的熟悉元素；但环球影业投入了大型制作与全国性发行资源。它改编自彼得·本奇利（Peter Benchley）的畅销小说，并由当时已崭露头角的斯皮尔伯格执导。

    换句话说，**B级片式题材 + A级制作与发行 + 高水准的悬念调度**，竟然成了一次好莱坞商业史的转折点。题材通俗，不意味着艺术成就只能止步于通俗。

    ### 二、票房纪录：年度冠军与历史冠军不是一回事

    《大白鲨》于 **1975 年 6 月 20 日**在美国上映，北美票房约 **2.61 亿美元**（常见历史统计口径），超过当时其他电影的票房纪录，成为《星球大战》（1977）出现前的全球票房纪录保持者。注意：电影数据库中的票房数字，可能混合了首轮发行、持续公映和后续重映，不能把所有口径下的数字当成同一年取得的收入。

    如果只用未调整通胀的**北美票房**比较上映年份的冠军，会发现波动极大：

    | 上映年份 | 当年代表性票房冠军 | 北美票房约数 |
    | --- | --- | --- |
    | 1974 | 《灼热的马鞍》（Blazing Saddles） | 1.20 亿美元 |
    | 1975 | 《大白鲨》（Jaws） | 2.61 亿美元 |
    | 1976 | 《洛奇》（Rocky） | 1.17 亿美元 |
    | 1977 | 《星球大战》（Star Wars） | 3.07 亿美元 |
    | 1978 | 《油脂》（Grease） | 1.60 亿美元 |
    | 1979 | 《克莱默夫妇》（Kramer vs. Kramer） | 1.06 亿美元 |

    这些是供比较量级的历史票房约数，**按作品上映年份归类，并非各自然年度的实际进账**；部分作品的放映期跨年，统计来源对重映、首轮发行的处理也未必一致。因此不宜把表中的差异直接解释为某年的电影市场繁荣或衰退。

    核心区别是：**年度票房冠军**只需要赢过那一年上映的其他电影；**历史票房纪录**则需要赢过所有前人。《大白鲨》与《星球大战》恰好都是罕见的后者。

    ### 三、它不是发明了夏天看电影，而是奠定了现代暑期档的商业范式

    1975 年以前当然也有夏季上映的卖座影片。《大白鲨》的历史地位，在于把几种已经存在的发行和营销手段结合得极为成功：

    1. **六月上映**：故事发生在海滨度假季，现实中的暑期观众也正好准备去海边。
    2. **大规模同步开画**：美国首映覆盖 **409 家影院**，不同于过去不少重要电影先在少数城市上映、再逐步扩张的模式。
    3. **全国电视广告与统一视觉符号**：巨鲨从水下逼近游泳者的海报，加上约翰·威廉姆斯（John Williams）标志性的双音配乐，几乎不用解释剧情就能传递卖点。
    4. **集中制造大众话题**：广告、海报、原著知名度与观众口碑相互推动，把电影变成必须尽早观看的暑期事件。

    它**不是第一部使用全国电视宣传或宽幅发行的电影**，更不能字面理解为「创造了暑期上映」；它真正提供的是一个可被制片厂反复模仿的成功范式：

    > **容易理解的高概念故事 → 强力营销 → 集中上映 → 现象级票房**

    两年后的《星球大战》又把这条路线推向新的高度，并进一步展示出系列化、衍生商品与长期品牌经营的潜力。

    ### 四、机械鲨鱼老坏，为什么反而拍出经典悬念？

    拍摄时机械鲨鱼频繁出现问题，斯皮尔伯格不得不减少直接展示鲨鱼的镜头，更多通过**画外空间、鲨鱼视角、角色反应、剪辑和音乐**制造恐惧。

    - **画外空间（off-screen space）**：观众看不见鲨鱼，却始终意识到水下可能有东西。
    - **主观视点与悬念**：海滩上游人嬉戏，观众却因为镜头和音乐提前预感到危险。
    - **声画关系**：两音交替的配乐成为鲨鱼接近的声音标识，不需要怪物每次现身。
    - **人物戏与类型混合**：警长布罗迪、海洋学家胡珀、老渔夫昆特既构成冒险小队，也持续发生观念、阶层和性格冲突。

    这些手段未必是《大白鲨》首先发明的，却被组织得极其有效。它的伟大并不依赖于彻底推翻电影语言的既有规则，而在于把**希区柯克式悬念**与现代商业冒险片融合得异常成熟。

    ### 五、票房大鳄为什么还能进入严肃影史榜单？

    《大白鲨》并非只有商业与流行文化影响力。它在两套评选背景不同的经典电影榜单中也有明确席位：

    | 榜单 | 名次 |
    | --- | --- |
    | AFI 美国电影百年百大（1998） | 第 48 名 |
    | AFI 美国电影百年百大（2007 修订版） | 第 56 名 |
    | 《视与听》（Sight and Sound）2022 影评人票选 | 并列第 104 名 |
    | 《视与听》2022 导演票选 | 并列第 62 名 |

    但不能简单说**AFI 只看文化影响力、《视与听》只看视听创新**：前者评选美国电影经典，也考虑艺术成就；后者由国际影评人和导演投票，评判标准并非仅限技术实验。两者都认可《大白鲨》，反而说明**精湛的类型电影同样可以同时拥有大众感染力、成熟的电影语言与长久的历史价值**。

    ### 六、成功也有悖论

    《大白鲨》与《星球大战》常被视为现代商业大片产业体系的重要节点。但电影史上也有一种批评：大规模营销、集中发行和追求现象级爆款的制度化，可能让制片厂越来越依赖高概念、续集与成熟IP，而对不易营销的原创电影更谨慎。

    这不是说《大白鲨》本身是一部粗制滥造的电影；恰恰相反，**一部创造性极强的作品，有可能建立起一套后来被机械模仿的商业公式**。

    它留下的最有意思的三重遗产，或许可以写成：

    > **廉价怪兽片的题材传统 + 精湛的电影艺术 + 改写产业规则的票房奇迹。**

    一条鲨鱼，既让观众不敢下水，也让好莱坞学会了怎样经营整个夏天。🦈
