- slug: "sodom-and-gomorrah"
  added_at: "2026-10-12T16:00:01+08:00"
  title: "所多玛与蛾摩拉：天火焚城、回头的盐柱与义人的质问"
  english: "Sodom and Gomorrah — Genesis 18–19"
  teaser: "亚伯拉罕从五十个义人一路谈到十个、罗得收留陌生人、暴民围屋、硫磺与火从天而降，以及那位回头化为盐柱的妻子。故事真正争论的是集体审判与公义。"
  tags:
    - "《圣经》用典"
    - "宗教与伦理"
    - "西方文学"
    - "创世记"
  body: |
    “天火焚城”一般指《创世记》18–19章的**所多玛（Sodom）和蛾摩拉（Gomorrah）毁灭故事**。它与诺亚洪水一样，是古代近东宗教叙事里带有灭绝性后果的神圣审判；但这一次，文本让亚伯拉罕站出来，直接追问“为了恶人，能否把义人一起毁灭？”
    
    ### 一、故事从哪里开始？
    
    **《创世记》18:16–21：控诉到达天上。** 上帝告诉亚伯拉罕，所多玛与蛾摩拉的罪行沉重，指向它们的哀告甚多；上帝表示要“下去看看”控告是否属实。请注意，这里先交代了对罪行的控诉，却没有逐一列出所有城市居民各自犯了什么罪。
    
    **《创世记》18:22–33：亚伯拉罕与上帝谈判。** 亚伯拉罕问出整段最重要的问题：
    
    > “你真的要使义人与恶人一同灭亡吗？”（18:23，意译）
    
    他又问：审判全地者难道不该行公义吗？然后试探性地逐次提出：如果城里有**50、45、40、30、20、10**个义人，上帝会不会为了这些人赦免全城？每一次的回答都是不毁灭。谈判到十个人便结束，经文**没有解释亚伯拉罕为什么不继续往下问**。这是人类向神圣权威质询集体惩罚是否公平的著名场面。
    
    ### 二、两位访客与罗得（《创世记》19:1–11）
    
    两个使者来到所多玛，亚伯拉罕的侄子**罗得（Lot）**请他们回家吃饭、过夜。入夜后，城中的男人围住屋子，要他交出两名陌生访客，情节通常被理解为带有羞辱目的的**群体性暴力和强奸威胁**。
    
    罗得拒绝交出客人，却提出把自己的两个女儿交给暴民。这在今天看来同样令人震惊：**罗得得到拯救，不等于叙事已经认可了他在这一幕的全部行为。** 暴民拒绝，转而威胁罗得；使者把他拉回屋内，使屋外的人眼目昏乱，无法找到门。
    
    这也解释了为什么“所多玛之罪”不能未经分析就简化成“城里的人有同性恋倾向”：故事场景涉及的是**非自愿的性暴力、对外来者的羞辱和集体侵犯**，并非两个成年人之间自愿的亲密关系。
    
    ### 三、逃离、天火与盐柱（《创世记》19:12–29）
    
    使者通知罗得城将毁灭，催他带家人离开。罗得去告诉将娶其女儿的男子，对方却以为他在开玩笑。到天亮，罗得仍然迟疑，使者于是握住他、妻子和两个女儿的手，把他们带到城外；经文特别将此举归于神的怜悯。
    
    使者命令他们逃命，不要在平原停留，**也不要回头**。罗得请求逃往附近的小城琐珥（Zoar），获准后带家人离开。
    
    接着毁灭发生：
    
    > “耶和华将硫磺与火从天上降在所多玛和蛾摩拉。”（19:24，意译）
    
    经文说城、平原、城中居民及地上的植物受到毁灭。罗得的妻子回头观看，变成了**一根盐柱（pillar of salt）**。文本没有直接解释她究竟因眷恋旧生活、好奇、违命或别的动机而回头；这些多是后来的解释。
    
    第二天，亚伯拉罕远望那片土地，只见烟向上升腾，仿佛熔炉的烟。故事至此完成了“火从天降、城市化为灰烬”的视觉图景。
    
    ### 四、故事还有一个更黑暗的尾声（《创世记》19:30–38）
    
    罗得后来带两个女儿住进山洞。两个女儿担心没有机会延续后代，便在先后两夜让父亲醉酒，与他发生性关系，后来分别生下摩押（Moab）和便亚米（Ben-ammi），在叙事中成为摩押人和亚扪人的祖先。
    
    这是带有古代民族起源解释色彩、同时包含乱伦的段落。**它在经文里确实存在，但并不意味着这种行为被推荐或肯定。** 只记住“罗得是获救义人”的儿童版梗概，反而会漏掉故事极其复杂的伦理张力。
    
    ### 五、所多玛究竟因为什么被毁？
    
    **《创世记》19章的直接场景**强调城中暴民对陌生客人的集体性暴力。古代待客义务与保护寄居者的伦理在此受到严重侵犯。
    
    **《以西结书》16:49–50**又专门回顾所多玛，说那里骄傲、丰衣足食、安逸，却不扶助穷困者；下一节还指责其傲慢并行可憎之事。可见在《希伯来圣经》内部，“所多玛之罪”就不仅是一种狭义的性道德标签，还牵涉**暴力、骄傲、贫富与社会不义**。
    
    一些基督教经文和后世神学会强调性方面的罪；英语的 sodomy 一词也由 Sodom 衍生。但**词语后来的法律或道德用法，不等于《创世记》19章的全部含义**。不同宗教传统对具体罪行的排序并不一致。
    
    ### 六、这场惩罚公平吗？
    
    故事的伦理焦点不仅是“坏人受罚”，而且是**是否允许为了审判一个社会，把其中可能无辜的人也一同毁灭**。亚伯拉罕不是旁观者，而是主动质问：
    
    > “审判全地的主，岂能不行公义？”（18:25，意译）
    
    传统释经常强调：毁灭发生前已经有控诉、察验、求情和救人行动；现代伦理阅读则仍会追问儿童、无力阻止暴行者，以及其他生命为何要一同承担后果。十个义人的条件**不是证明其余居民逐个有罪的调查报告**，而是这段故事处理集体审判问题的叙事方式。
    
    与诺亚洪水的“保存少数人、毁掉旧世界”相比，所多玛故事尤为醒目的一点是：**经文让一个人当面向上帝提出公义的要求，而不是只写他服从命令。**
    
    ### 七、读外国文学时怎样识别这些典故？
    
    - **Sodom and Gomorrah（所多玛与蛾摩拉）**：道德败坏的城市、受到审判的社会、骄奢与暴力，或即将降临的灾难；作者对“败坏”的定义可能不同。
    - **Fire and brimstone（火与硫磺）**：源于毁城意象，后来常用于地狱审判、严厉布道、末世灾难的描写。
    - **Lot's wife / pillar of salt（罗得之妻／盐柱）**：常象征逃离过去时的回望、违禁的一瞥、执著、迟疑或无法割舍的故乡；具体意义取决于作品。
    - **Abraham's bargaining（亚伯拉罕的求情）**：为可能无辜的人辩护，以及以公义原则质问权威。
    - **Zoar（琐珥）**：在毁灭边缘获得保全的小城，某些文学文本会借它表示最后的庇护所。
    
    **一句话记忆：** 所多玛故事并非只有“罪恶之城被天火消灭”。它还包括**亚伯拉罕追问集体惩罚的正当性、罗得令人不安的选择、回头的妻子，以及灾难过后仍然纠缠不清的伦理问题**。
