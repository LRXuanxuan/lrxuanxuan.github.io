- slug: "llm-figurative-language-pragmatics"
  added_at: "2026-10-12T13:58:20+08:00"
  title: "LLM 为什么能听懂反话、隐喻和双关？"
  english: "Why LLMs Handle Metaphor, Sarcasm, Humor and Puns"
  teaser: "它没有被逐条教过「说反话守则」，却能读懂阴阳怪气：从下一个 token 预测到语用学，再到幽默与真正理解之间的距离。"
  tags:
    - "人工智能"
    - "大语言模型"
    - "语言学"
    - "幽默与修辞"
  body: |
    「真棒，我的实验又炸了。」一个只会查字典的程序可能认为说话人在赞美；现代大语言模型（LLM）却通常知道，这是在**阴阳怪气**。它不需要先调用一个人工写好的「反讽规则库」，也不必为每一种修辞单独设置开关。

    ### 一、从预测下一个词，怎么学到言外之意？

    GPT 类语言模型的经典预训练目标是：根据前文，尽可能准确地预测后续 token。可以简写成 **最小化 −log p(xₜ ∣ x₁, …, xₜ₋₁)**（即下一个 token 的负对数似然）。

    但真实文本并不只有字典意义。要预测小说人物说完「好极了」之后接下来会抱怨什么，模型就得利用上下文推测**事件好坏、人物态度、说话者意图以及前后文的关系**。海量训练文本还包含人物对话、笑话、影评、语言学解释，甚至是「某句话为什么好笑」的分析。

    在 Transformer 中，词的隐藏表征会随上下文变化。「真棒」和「实验又炸了」一起出现时，前者的字面褒义不再足以解释整句话；后者提供的负面事件与「又」所暗示的重复挫败，会影响模型对说话意图的判断。

    > **字面意思（literal meaning）不一定等于说话者真正想表达的意思（speaker meaning）。**

    这属于**语用学（pragmatics）**：理解一句话怎样在特定场景、人物关系和共同知识中被使用。用一个便于理解的抽象式子表示，就是 **p(说话者意图 ∣ 话语、上下文)**。注意，这不是说模型内部真有一个叫「讽刺」的显式概率变量；隐藏表征具体如何实现这类推断，仍是研究问题。

    ### 二、几种语言花活，难点其实不一样

    - **惯用语、成语（idiom）**：「kick the bucket」表示死亡，不必逐字翻成踢水桶。频繁出现的固定搭配可以被模型整体学习，很多时候靠词汇化与搭配规律就能解决。
    - **隐喻（metaphor）**：「这个理论的地基不稳」不是说论文盖在会摇的房子上，而是把建筑的「地基支撑房屋」映射为「前提支撑论证」。难点是跨概念领域的关系对应。
    - **反语、讽刺（irony / sarcasm）**：「真是天才操作」若紧跟着删库事故，正面措辞与负面事件发生冲突。除了识别矛盾，还要判断说话者是否故意表达相反态度。
    - **双关（pun）**：同音、近音或一词多义让一句话能够同时激活两种解释。模型需要保留多条可能的语义路径；遇上依赖某种方言、谐音或文化背景的冷笑话，就尤其容易失手。
    - **幽默（humor）**：很多笑话先建立预期，再用包袱使人意外，最后又让人发现第二种解释自洽。可概括为 **预期 → 违背预期 → 重新解释**；但「意外」本身不等于「好笑」。

    ### 三、它真的理解了吗？

    对多数熟悉的修辞，LLM 可以在行为上给出接近人类的解释；但这不意味着它拥有相同的社会经验、情绪体验或审美感受。**识别一个笑话、解释它的机制、亲自觉得好笑**，是三件可以分开讨论的事。

    尤其遇到新颖隐喻、跨文化双关、隐含的人际关系、语音语调或刻意设置的歧义，模型仍会误判。学术研究也发现，语用能力不能简单用某个单项 benchmark 的高分一锤定音。

    这恰好给老科幻里的机器人形象开了一个玩笑：它们常被设定为「形式逻辑能力无穷大，听不懂一句反话」；现实中的 LLM 却往往**先学会了阴阳怪气，算数还未必每次都对**。😼
