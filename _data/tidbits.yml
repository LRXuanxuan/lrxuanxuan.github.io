  body: |
    《巴别塔》（Tower of Babel）的完整故事出自《创世记》11:1–9，**正文总共只有九节**。它出现在大洪水叙事之后、亚伯拉罕家族故事之前。读这九节时，最好先把经文本身和历代的解释分开：经文写了造城、筑塔、语言混乱与人口分散，却没有直接叙述“人类向上帝开战”。
    
    ### 一、希伯来原文（《创世记》11:1–9）
    
    以下是希伯来语《创世记》的九节正文，保留元音符号，采用方便网页阅读的逐节排版。中文译文列在下一小节。
    
    <p dir="rtl" lang="he">א　וַיְהִי כָל-הָאָרֶץ, שָׂפָה אֶחָת, וּדְבָרִים, אֲחָדִים.</p>
    
    <p dir="rtl" lang="he">ב　וַיְהִי, בְּנָסְעָם מִקֶּדֶם; וַיִּמְצְאוּ בִקְעָה בְּאֶרֶץ שִׁנְעָר, וַיֵּשְׁבוּ שָׁם.</p>
    
    <p dir="rtl" lang="he">ג　וַיֹּאמְרוּ אִישׁ אֶל-רֵעֵהוּ, הָבָה נִלְבְּנָה לְבֵנִים, וְנִשְׂרְפָה, לִשְׂרֵפָה; וַתְּהִי לָהֶם הַלְּבֵנָה, לְאָבֶן, וְהַחֵמָר, הָיָה לָהֶם לַחֹמֶר.</p>
    
    <p dir="rtl" lang="he">ד　וַיֹּאמְרוּ הָבָה נִבְנֶה-לָּנוּ עִיר, וּמִגְדָּל וְרֹאשׁוֹ בַשָּׁמַיִם, וְנַעֲשֶׂה-לָּנוּ, שֵׁם: פֶּן-נָפוּץ, עַל-פְּנֵי כָל-הָאָרֶץ.</p>
    
    <p dir="rtl" lang="he">ה　וַיֵּרֶד יְהוָה, לִרְאֹת אֶת-הָעִיר וְאֶת-הַמִּגְדָּל, אֲשֶׁר בָּנוּ, בְּנֵי הָאָדָם.</p>
    
    <p dir="rtl" lang="he">ו　וַיֹּאמֶר יְהוָה, הֵן עַם אֶחָד וְשָׂפָה אַחַת לְכֻלָּם, וְזֶה, הַחִלָּם לַעֲשׂוֹת; וְעַתָּה לֹא-יִבָּצֵר מֵהֶם, כֹּל אֲשֶׁר יָזְמוּ לַעֲשׂוֹת.</p>
    
    <p dir="rtl" lang="he">ז　הָבָה, נֵרְדָה, וְנָבְלָה שָׁם, שְׂפָתָם--אֲשֶׁר לֹא יִשְׁמְעוּ, אִישׁ שְׂפַת רֵעֵהוּ.</p>
    
    <p dir="rtl" lang="he">ח　וַיָּפֶץ יְהוָה אֹתָם מִשָּׁם, עַל-פְּנֵי כָל-הָאָרֶץ; וַיַּחְדְּלוּ, לִבְנֹת הָעִיר.</p>
    
    <p dir="rtl" lang="he">ט　עַל-כֵּן קָרָא שְׁמָהּ, בָּבֶל, כִּי-שָׁם בָּלַל יְהוָה, שְׂפַת כָּל-הָאָרֶץ; וּמִשָּׁם הֱפִיצָם יְהוָה, עַל-פְּנֵי כָל-הָאָרֶץ.</p>
    
    ### 二、逐节中文直译
    
    以下为参照希伯来文本重新整理的**本站直译**，并非照录某一现代中文圣经译本。
    
    **11:1** 那时全地只有一种语言，人们说着相同的话。
    
    **11:2** 人们迁行时，在示拿地发现一片平原，便在那里定居。
    
    **11:3** 他们彼此说：“来吧，我们做砖，把砖烧透。”于是他们用砖代替石头，用沥青作灰泥。
    
    **11:4** 他们又说：“来吧，我们为自己建造一座城和一座塔，塔顶直达天穹；让我们为自己立名，免得分散到全地。”
    
    **11:5** 耶和华降下来，察看世人建造的城和塔。
    
    **11:6** 耶和华说：“看哪，他们是同一个民族，所有人都使用同一种语言；而这还只是他们开始做的事。如今，凡是他们谋划要做的，就没有什么能阻挡他们了。”
    
    **11:7** “来吧，我们下去，在那里混乱他们的语言，使他们彼此听不懂对方的话。”
    
    **11:8** 于是耶和华使他们从那里分散到全地；他们便停止建造那座城。
    
    **11:9** 因此那城被称作“巴别”，因为耶和华在那里混乱了全地的语言，并从那里把人们分散到全地。
    
    ### 三、原文里藏着哪些细节？
    
    **1. “塔顶通天”不一定是现代意义上的登天计划。** 希伯来语“其顶在天上”（rosho va-shamayim）可以是形容极高建筑的夸张说法。巴比伦地区的塔庙（ziggurat）常被拿来作为理解这一故事的历史背景，但不能据此断言经文中的塔就是某一座已确认的具体建筑。
    
    **2. “我们要为自己立名”与“免得分散”是人类自己说出的两重目的。** 前者可以被读作荣耀与骄傲，后者又与《创世记》9:1中“遍满全地”的命令构成张力。单读九节正文，却看不到对修塔者实施奴役、发动战争之类罪行的直接记载。
    
    **3. “耶和华降下来察看”含有值得玩味的反差。** 人类说塔顶通天，上帝却仍须“下来”才能看见它；许多文学阅读会注意到这里的叙事反讽。
    
    **4. 最惊人的其实是第六节。** “这只是他们开始做的事”与“没有什么能阻挡他们”既可以被理解成对傲慢和无约束集体力量的警告，也可以在现代阅读中变成对人类协作能力的赞叹。经文**没有明确写上帝因恐惧而行动**；“上帝害怕人类能力增长”是其中一种批判性阐释，而不是经文直接交代的心理独白。
    
    **5. “巴别”本身有文字游戏。** 希伯来文巴别（Bavel）在叙事里与“混乱”（balal）发生谐音关联；历史上的 Babylon / 巴比伦地名另有美索不达米亚语言背景，不宜把这段双关当作严格的历史词源学。
    
    ### 四、为什么不同读者能读出相反的寓意？
    
    **传统的傲慢论：** 人类试图为自己立名、突破应守的界限；混乱语言是制止僭越。犹太拉比注释后来还发展出“人类要上天与上帝交战”的情节，拉希（Rashi）在11:1的注释中引用过这种说法。**但“向上帝宣战”是释经传统的扩展，不在这九节正文之中。**
    
    **反集中化的读法：** 问题不在技术本身，而在所有人被单一语言、单一城市、单一目标捆绑。语言分化于是可以被理解为对强制同质化的限制。这是具有现代关怀的解释，而非经文唯一的公认结论。
    
    **萨根式的人文主义重读：** 卡尔·萨根在《暗淡蓝点》（Pale Blue Dot）中注意到“人类想做的事情将无法阻止”这一句，并质疑为什么人类走向群体协作和知识增长的神话，非得以神圣干预和挫败告终。他更偏爱一种鼓励人类承担未来责任、继续建设世界的神话。此处是在介绍**萨根的思想立场**，并非说《创世记》作者本来就在赞美科技进步。
    
    简化成两种彼此竞争的读法：
    
    > 传统警戒：共同语言与巨大的组织能力 → 骄傲地越界 → 被迫分散。
    
    > 现代反读：共同语言与巨大的组织能力 → 可能实现前所未有的事业 → 因外部限制而中断。
    
    ### 五、后来的文学、宗教和科幻怎样继续使用它？
    
    - **《使徒行传》第二章的五旬节（Pentecost）**：门徒说起不同地方的人能听懂的语言。基督教解释常将它与巴别塔并置，视作语言隔阂的某种象征性逆转；但故事没有说全人类从此真的恢复为同一种母语。
    - **“Babel / 巴别”**：在文学里常暗示语言混乱、翻译的困难、彼此无法理解，或浩大却充满歧义的知识系统。博尔赫斯的《巴别图书馆》（The Library of Babel）借用了这个古老名字，不过不是重述建塔事件。
    - **特德·姜《巴比伦之塔》（Tower of Babylon）**：以“如果人真能建造一座触及天穹的塔”为出发点，重新展开古人的空间宇宙观；这比一般将巴别仅仅当作傲慢警告的做法更有科幻趣味。
    - **宗教意象与工程史的反差**：从建筑和翻译，到数学、通信网络、国际科学合作，人类不断设法克服彼此分隔的成本。“被分散的人类又试图重新理解彼此”可以成为一种现代文明叙事，但这属于后世的创造性延伸。
    
    **阅读提示：** 看到 Tower of Babel、Babel、confusion of tongues 或“塔顶通天”，不必立刻认定作者在谴责骄傲；也可能是在讨论翻译、组织、知识的边界，乃至人类联合起来能够做到什么。
