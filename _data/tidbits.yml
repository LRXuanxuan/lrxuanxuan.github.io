- slug: "chip-process-nodes-cmos-scaling-limits"
  added_at: "2026-10-12T14:37:00+08:00"
  title: "XX nm 芯片究竟在缩什么？从 MOS 开关到制程瓶颈"
  english: "Semiconductor Process Nodes, Dennard Scaling and CMOS Scaling Limits"
  teaser: "3 nm 不代表某个晶体管尺寸恰好是 3 nm。把芯片看成 MOS 开关与 RC 网络，就能理解它为何曾经越缩越快、如今又为何越来越难。"
  tags:
    - "半导体"
    - "芯片制程"
    - "数电与模电"
    - "集成电路"
    - "计算机硬件"
  body: |
    听到「3 nm 芯片」「5 nm 制程」，很容易以为它指的是「晶体管栅极长度恰好为 3 nm 或 5 nm」。**这在现代先进制程中是不准确的。**这些数字主要是工艺代际的名称，不再与某一个统一的物理尺寸一一对应；不同厂商的同名节点也不能仅凭数字判断谁的晶体管更密、更快。

    如果学过本科数电、模电，把芯片理解为**许多 CMOS 开关及其相连的电阻、电容网络**，就能解释制程缩小为何曾经带来巨大收益，又为何开始撞上瓶颈。

    ### 一、「缩小」究竟是在缩什么？

    MOSFET 有沟道长度 L、沟道宽度 W、栅介质厚度 t，以及源漏接触、布线与器件间距。实际工艺要优化的不只有沟道：晶体管栅极节距、金属互连节距、接触孔、存储单元面积，也都会影响整颗芯片的密度。

    理想化地说，若所有横向尺寸都缩为原来的 1/k，单个器件的占用面积大致缩为 1/k²；同样大小的芯片上，就可能容纳约 k² 倍的器件。但**现代工艺节点的名称并不是这样的几何缩放比例**，尤其不能把「7 nm 到 5 nm」直接当成真正的长度按 5/7 缩小。

    工厂又是怎样把图形造小的？主要依靠**光刻、沉积、刻蚀、掺杂**等步骤反复加工晶圆。光刻分辨率常用雷利关系近似描述：**R ≈ k₁λ / NA**，其中 λ 为曝光波长，NA 为数值孔径。传统先进 DUV 光刻常使用 193 nm 光源，EUV 使用约 13.5 nm；浸没式光刻、多重图形化与计算光刻进一步帮助制造小于光波长的精细结构。它绝不是拿一张版图直接缩印那么简单。

    ### 二、缩小 MOSFET，为何曾经同时变快又省电？

    先复习两条本科电路公式：

    - **栅电容：C_g ≈ εWL / t**。面积变小会减少栅电容；把栅介质变薄则有利于增强栅极控制。
    - **门电路传播延迟：t_p ≈ R_on C_L**；等价地也可粗略写为 **t_p ≈ C_L V_DD / I_drive**。要充放的电荷越少，开关就越快。

    1970 年代提出的**登纳德缩放（Dennard scaling）**描述了一个特别理想的条件：设所有线性尺寸以及供电电压都缩为原来的 1/k，保持器件内的电场大致不变。

    在经典长沟道 MOSFET 模型和理想恒电场缩放假设下：

    - 晶体管占用面积约变为 **1/k²**；
    - 栅电容 C 约变为 **1/k**；
    - 驱动电流 I 约变为 **1/k**，但电荷 Q = CV 会变为 **1/k²**；
    - 传播延迟 Q/I 因而约变为 **1/k**；
    - 单次充放电的能量按 **E ≈ CV²** 估算，约变为 **1/k³**。

    注意，这些是**理想缩放规律，不是对每一代真实芯片的性能承诺**。但它揭示了早期集成电路产业为什么如此热衷于缩小器件：

    > **尺寸更小 → 面积里能放更多逻辑 → 单个开关更快、每次翻转更省电。**

    ### 三、第一堵墙：电压降不下去，MOS 管也关不干净

    数电课程常把 MOS 管当作理想开关：「栅压低于阈值，电流便为零」。实际上，MOSFET 在阈值以下仍有**亚阈值电流（subthreshold current）**，且随栅压近似呈指数变化。

    对室温下依靠热发射工作的传统 MOSFET，理想亚阈值摆幅的下限约为 **60 mV/dec**：换言之，栅压降低约 60 mV，漏极电流才有可能降低一个数量级。开与关之间并不存在一条无限陡峭的竖线。

    如果继续降低供电电压 V_DD，为了保持开关速度，往往又想降低阈值电压 V_TH；但 **V_TH 降得太多，关断漏电就可能显著增加**。再叠加噪声容限、工艺波动等约束，供电电压很难像早期恒电场模型那样持续按比例缩小。

    数电里熟悉的动态功耗公式便成了问题核心：**P_dyn ≈ α C V_DD² f**，其中 α 是开关活动因子、C 是有效负载电容、f 是频率。电压不能继续等比例降低，而晶体管数量与工作频率还在增长，芯片的功耗与散热便越来越难管控。

    > **制程变小，不等于整颗芯片会自动同比例省电。**

    ### 四、第二堵墙：沟道太短，栅极逐渐失去控制权

    理想情况下，MOSFET 的沟道应由 Gate（栅极）控制。但沟道长度 L 越短，Source 和 Drain 就越接近，漏极电场也越容易影响沟道势垒，引发**短沟道效应（short-channel effects）**。

    一个典型现象是**漏致势垒降低（DIBL）**：即使栅极想把晶体管关掉，较高的漏极电压也可能削弱源端势垒，让关断电流增大。可以打个比方：原先栅极独自掌管开关，现在漏极也能偷偷「撬门」。

    工程师的对策，是不断改善栅极对沟道的静电包围：

    - **平面 MOSFET（Planar MOS）**：栅极主要在沟道上方；
    - **FinFET（鳍式场效应晶体管）**：沟道凸起为鳍状，栅极从更多侧面控制它；
    - **GAA（Gate-All-Around，环绕栅极）**：用栅极进一步包围纳米片或纳米线沟道。

    这些结构演化并不是为了让晶体管长得好看，而是为了在越来越短的沟道下仍保持足够的栅极控制能力。

    栅介质也有类似难题：根据 **C = εA/t**，减小厚度 t 可以增大电容，但介质薄到一定程度，栅极隧穿漏电就会变得严重。于是出现**高介电常数（high-k）栅介质**：尽量保留较大的物理厚度，同时获得较强的电容耦合。常见的 **EOT（等效氧化层厚度）**，描述的就是这种电学等效效果，而不是材料的实际几何厚度。

    ### 五、第三堵墙：晶体管在加速，导线却不肯配合

    一颗芯片不只是十亿、百亿个孤立开关，还必须用层层金属互连把它们连接起来。模电里最朴素的导线电阻公式是 **R = ρL/A**。

    假设连金属线的长度、宽度与厚度都按 1/k 缩小，那么长度只变为 1/k，截面积却变为 1/k²，理想电阻会变成 **kR**。实际纳米级细导线还会受到表面、晶界散射及接触电阻等因素影响。与此同时，并不是所有全局连线的长度都能跟着缩短。

    因此，尽管门电路内部的晶体管越来越快，**跨模块布线、RC 延迟、驱动缓冲器和数据搬运**仍可能越来越贵。这里需要一个重要限定：*在完美等比例缩放的简单模型中，局部线的 RC 未必恶化；真正麻烦的是非理想的互连缩放、线材电阻率、全局路径长度和布局约束*。

    这也解释了现代 CPU/GPU 为什么越来越强调 Cache、数据局部性（locality）、片上网络（NoC）以及高带宽内存：**算术不一定贵，把数据搬到计算单元面前可能更贵。**

    ### 六、第四堵墙：原子尺度、工艺波动和模拟电路的脾气

    关键结构缩到数纳米量级后，材料界面、厚度起伏以及器件之间的统计差异，都可能对阈值电压、漏电与良率产生明显影响。光刻之外，刻蚀、薄膜沉积、接触工艺与缺陷控制同样很难。

    模拟电路还面临专门的烦恼：电源电压降低使多个晶体管堆叠时的**电压裕量（voltage headroom）**不足；短沟道器件的输出电阻和本征增益也可能不利于高增益放大器。差分对、基准源、ADC 等模块还十分在意器件匹配、噪声和耐压。

    于是「更先进的制程」并不等于「更适合每一种电子电路」。模拟、射频、功率、工业控制和部分军工航天电路，都可能更愿意使用已充分验证的成熟工艺。当然，军工也会采用先进工艺；而且**成熟制程不代表天然抗辐射**，具体还取决于器件结构、加固设计与任务环境。

    ### 七、为什么手机、GPU 不能简单拿几颗老芯片凑数？

    你当然可以「力大砖飞」：服务器本来就大量采用多处理器、多 GPU 并行。但对手机和笔记本来说，多塞几颗较老的芯片，会同时付出**封装与主板面积、功耗、散热、跨芯片通信延迟和内存一致性**方面的代价。

    假设一颗先进芯片算力为 100、功耗为 10 W；一颗旧节点芯片算力为 40、功耗也为 10 W。三颗旧芯片的纸面算力可达 120，但功耗已是 30 W，还没有计算通信与同步成本。这个例子只是说明约束，**不是对真实工艺节点的跑分比较**。

    因此消费者真正想要的是**性能／瓦（performance per watt）**，以及在固定空间、热预算内能够实现的功能，而不是单纯把理论算力相加。数据中心虽然可以堆数量，但计算规模越大，供电和冷却成本越惊人，也同样追求能效。

    现代的一种折中路线便是**芯粒（chiplet）与异构封装**：把最需要高密度、高性能的计算模块放在较先进的节点上；让 I/O、模拟接口等部分依据自身需求选用更成熟的工艺，再通过先进封装连接。它不是抛弃「力大砖飞」，而是努力避免把「砖」之间的通信代价堆得过高。

    ### 八、最后厘清三个容易混淆的说法

    1. **摩尔定律（Moore's law）**主要描述集成电路晶体管数量的长期增长趋势；它不是「主频必定不断翻倍」，也不是严格的自然定律。
    2. **登纳德缩放（Dennard scaling）**说明在一组理想前提下，缩小尺寸和电压可以同时改善速度、能耗及密度；这些前提后来越来越难成立。
    3. **XX nm 工艺节点（process node）**是代际名称，不是可直接拿卡尺去量的统一晶体管尺寸；比较实际芯片还要看架构、设计、良率、内存与封装等因素。

    所以现代制程的难点，不是单纯「刻不出更小的图形」；而是**刻小以后，还得确保开关关得住、数据传得动、电源供得起、热散得掉、成本能够接受**。

    > **曾经：缩小 MOS 开关 → 更密、更快、更省电。**
    >
    > **如今：还可以缩，但每向前一步，都需要器件结构、材料、光刻、互连、封装与系统架构一起补课。**

    半导体工业的进步史，大抵就是人类想继续赚 CMOS 免费午餐、而物理学开始逐项收费的故事。😼
